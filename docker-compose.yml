version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autoprint_postgres
    restart: always
    environment:
      POSTGRES_DB: autoprint_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoprint_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/autoprint_db?schema=public"
      JWT_SECRET: "prod-jwt-secret-autoprint-saas-2026-key"
      BASE_SERVER_URL: "https://api.yourdomain.com"
      FRONTEND_URL: "https://print.yourdomain.com"
      UPLOAD_DIR: "/app/uploads"
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
